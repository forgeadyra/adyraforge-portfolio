name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          detect --source /repo --log-opts="--all" --redact --verbose

  backend:
    name: backend (lint, tests, deploy check, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      PYTHONPATH: ${{ github.workspace }}/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install (hash-checked)
        run: pip install --require-hashes -r requirements/dev.txt
      - name: ruff
        run: ruff check --config pyproject.toml . ../ml
      - name: black
        run: black --config pyproject.toml --check . ../ml
      - name: Migrations are up to date
        env:
          DJANGO_ENV: test
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: pytest
        run: pytest
      - name: manage.py check --deploy (production settings)
        env:
          DJANGO_ENV: production
          ALLOWED_HOSTS: api.adyraforge.com
          ADMIN_URL: ci-admin-path-not-real-0000/
          CORS_ALLOWED_ORIGINS: https://adyraforge.com
          CSRF_TRUSTED_ORIGINS: https://adyraforge.com
          FRONTEND_URL: https://adyraforge.com
          EMAIL_URL: smtp+tls://ci:not-a-real-password@smtp.invalid:587
          TURNSTILE_SECRET_KEY: ci-placeholder-not-a-real-turnstile-secret
        run: |
          export SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as k; print(k())')"
          python manage.py check --deploy --fail-level WARNING
      - name: pip-audit
        run: |
          pip-audit --strict -r requirements/base.txt
          pip-audit --strict -r requirements/dev.txt

  frontend:
    name: frontend (lint, types, tests, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://api.adyraforge.com
      NEXT_PUBLIC_SITE_URL: https://adyraforge.com
      # No backend in CI: ISR pages build with empty content. Real deploys must
      # reach the API at build time (the build fails otherwise, by design).
      NEXT_BUILD_WITHOUT_API: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
