name: Deploy backend

# Render's free instance has no pre-deploy command, so migrations run here first and
# only then is the Render deploy triggered. The database OWNER credentials exist only
# as a GitHub encrypted secret; the running API on Render uses the least-privilege
# adyraforge_app role and cannot change the schema.

on:
  push:
    branches: [main]
    paths: ["backend/**", "ml/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never cut a migration short

jobs:
  migrate-then-deploy:
    name: migrate (database owner), then deploy Render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Management-command settings: no hosts, no URLs, nothing but the database.
      DJANGO_ENV: maintenance
      PYTHONPATH: ${{ github.workspace }}/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - name: Install runtime dependencies (hash-checked)
        run: pip install --require-hashes -r requirements/base.txt
      - name: Migrate and create the cache table as the database owner
        env:
          DATABASE_URL: ${{ secrets.NEON_OWNER_DATABASE_URL }}
        run: |
          export SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as k; print(k())')"
          python manage.py migrate --noinput
          python manage.py createcachetable
      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
