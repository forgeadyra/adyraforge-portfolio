name: Maintenance

# Render's free instance has no cron jobs: purge expired sessions here, daily.
# Runs the real `manage.py clearsessions` with the maintenance settings (no hosts, no
# URLs, nothing but the database) as the least-privilege adyraforge_app role, which
# can delete rows but cannot change the schema. Scheduled runs use the default
# branch (main); run it by hand from the Actions tab at any time.

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  clearsessions:
    name: purge expired sessions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: maintenance
      PYTHONPATH: ${{ github.workspace }}/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - name: Install runtime dependencies (hash-checked)
        run: pip install --require-hashes -r requirements/base.txt
      - name: manage.py clearsessions (app role)
        env:
          DATABASE_URL: ${{ secrets.NEON_APP_DATABASE_URL }}
        run: |
          export SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as k; print(k())')"
          python manage.py clearsessions
