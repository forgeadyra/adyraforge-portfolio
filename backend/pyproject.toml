[project]
name = "adyraforge-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF"]
ignore = ["RUF012"]
# En dashes are intentional in user-facing range labels ("$500–1,500").
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "adyra_ml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = [".", "../ml"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:No directory at.*staticfiles:UserWarning"]
