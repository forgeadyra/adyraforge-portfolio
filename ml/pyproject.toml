[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adyra-ml"
version = "0.1.0"
description = "AdyraForge project recommender (scikit-learn), imported by the backend."
requires-python = ">=3.12,<3.13"
# scikit-learn is added (pinned, hashed in backend/requirements) when the
# recommender is implemented; unused dependencies are not installed (rule 15).
dependencies = []

[tool.setuptools.packages.find]
include = ["adyra_ml*"]
